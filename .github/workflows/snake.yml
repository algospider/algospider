name: snake

on:
  push:
    branches: [main]
    paths: ["README.md"]
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate snake svgs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=58A6FF&color_dots=#21262D,#1F4468,#2E6BAF,#3E8ED9,#58A6FF
            dist/github-contribution-grid-snake-light.svg?color_snake=1F6FEB&color_dots=#EBEDF0,#9CC3F7,#5C97E0,#3171C9,#1F6FEB

      - name: publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
