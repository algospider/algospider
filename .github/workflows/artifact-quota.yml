name: Artifact storage report
on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1,4'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check artifact storage across all repos
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const freeQuotaMB = 500;
            let totalBytes = 0;
            let totalArtifacts = 0;
            let totalRepos = 0;
            let repoPage = 1;

            while (true) {
              const repos = await github.paginate(github.rest.repos.listForAuthenticatedUser, {
                per_page: 100,
                page: repoPage,
                type: 'owner',
              });

              if (repos.length === 0) break;

              for (const repo of repos) {
                if (repo.archived || repo.fork) continue;

                let page = 1;
                while (true) {
                  const { data } = await github.rest.actions.listArtifactsForRepo({
                    owner: repo.owner.login,
                    repo: repo.name,
                    per_page: 100,
                    page: page,
                  });

                  for (const a of data.artifacts) {
                    totalBytes += a.size_in_bytes;
                    totalArtifacts++;
                  }

                  if (data.total_count <= page * 100) break;
                  page++;
                }
                totalRepos++;
              }

              if (repos.length < 100) break;
              repoPage++;
            }

            const totalMB = (totalBytes / 1048576).toFixed(1);
            const usedPercent = ((totalMB / freeQuotaMB) * 100).toFixed(1);

            console.log('═══════════════════════════════════════════');
            console.log('  ARTIFACT STORAGE REPORT');
            console.log('═══════════════════════════════════════════');
            console.log(`  Repos scanned:      ${totalRepos}`);
            console.log(`  Total artifacts:    ${totalArtifacts}`);
            console.log(`  Total size:         ${totalMB} MB / ${freeQuotaMB} MB (free tier)`);
            console.log(`  Usage:              ${usedPercent}%`);
            console.log(`  Status:             ${totalMB >= freeQuotaMB ? '⚠️  QUOTA EXCEEDED' : '✅  Within limits'}`);
            console.log('═══════════════════════════════════════════');
            console.log('  Note: Quota recalculates every 6-12h.');
            console.log('  Run cleanup-artifacts to free up space.');
            console.log('═══════════════════════════════════════════');

            if (totalMB >= freeQuotaMB) {
              core.setFailed(`Artifact storage quota exceeded: ${totalMB} MB / ${freeQuotaMB} MB`);
            }
