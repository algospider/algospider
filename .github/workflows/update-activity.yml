name: Update README activity
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# 2026-11-04: re-armed schedule after github's idle-cron disable + explicitly
# granted contents:write so the activity commit can't be rejected.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jamesgeorge007/github-activity-readme@master
        with:
          COMMIT_MSG: 'update activity log'
          MAX_LINES: 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
