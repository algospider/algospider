name: Stale management
on:
  schedule:
    - cron: '30 1 * * 1-5'
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: |
            This issue has been sitting around for 60 days with no updates.
            If there's no activity in the next 7 days, I'll close it.
            Don't take it personally — ping me if it's still relevant.
          stale-pr-message: |
            This PR has been idle for 45 days.
            I'll close it in a week unless someone picks it back up.
            Feel free to reopen when you're ready.
          close-issue-message: |
            Closing this due to inactivity.
            Still an issue? Open a new one with fresh context.
          close-pr-message: |
            Closing this PR due to lack of activity.
            You can always reopen or submit a fresh one.
          days-before-issue-stale: 60
          days-before-pr-stale: 45
          days-before-issue-close: 7
          days-before-pr-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,enhancement
          exempt-pr-labels: pinned,security,dependencies
          operations-per-run: 100
