name: Cleanup old artifacts
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      days_old:
        description: 'Delete artifacts older than this many days'
        default: '7'
        type: number
      dry_run:
        description: 'Only list artifacts, do not delete'
        default: 'false'
        type: boolean

jobs:
  quota-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check current artifact storage
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const freeQuotaMB = 500;
            let totalBytes = 0;
            let totalArtifacts = 0;
            let totalRepos = 0;

            for await (const repo of github.paginate.iterator(
              github.rest.repos.listForAuthenticatedUser, { per_page: 100, type: 'owner' }
            )) {
              if (repo.archived || repo.fork) continue;

              for await (const artifact of github.paginate.iterator(
                github.rest.actions.listArtifactsForRepo,
                { owner: repo.owner.login, repo: repo.name, per_page: 100 }
              )) {
                totalBytes += artifact.size_in_bytes;
                totalArtifacts++;
              }
              totalRepos++;
            }

            const totalMB = (totalBytes / 1048576).toFixed(1);
            const usedPercent = ((totalMB / freeQuotaMB) * 100).toFixed(1);

            console.log('═══════════════════════════════════════════');
            console.log('  BEFORE CLEANUP');
            console.log('═══════════════════════════════════════════');
            console.log(`  Repos:    ${totalRepos}`);
            console.log(`  Artifacts: ${totalArtifacts}`);
            console.log(`  Size:     ${totalMB} MB / ${freeQuotaMB} MB`);
            console.log(`  Usage:    ${usedPercent}%`);
            console.log('═══════════════════════════════════════════');

            if (totalMB >= freeQuotaMB) {
              core.warning(`Quota exceeded: ${totalMB} MB used`);
            }

            core.setOutput('before_mb', totalMB);

  cleanup:
    runs-on: ubuntu-latest
    needs: quota-check
    steps:
      - name: Delete old artifacts across all repos
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const daysOld = ${{ github.event.inputs.days_old || 7 }};
            const dryRun = '${{ github.event.inputs.dry_run }}' === 'true';
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - daysOld);

            let totalDeleted = 0;
            let totalFreed = 0;
            let totalRepos = 0;

            for await (const repo of github.paginate.iterator(
              github.rest.repos.listForAuthenticatedUser, { per_page: 100, type: 'owner' }
            )) {
              if (repo.archived) continue;
              const fullName = repo.full_name;
              let repoDeleted = 0;
              let repoFreed = 0;

              for await (const artifact of github.paginate.iterator(
                github.rest.actions.listArtifactsForRepo,
                { owner: repo.owner.login, repo: repo.name, per_page: 100 }
              )) {
                if (new Date(artifact.created_at) >= cutoff) continue;

                console.log(
                  `${dryRun ? '[DRY RUN]' : ''} [${fullName}] "${artifact.name}" ` +
                  `${(artifact.size_in_bytes / 1024).toFixed(1)} KB (created: ${artifact.created_at})`
                );
                if (!dryRun) {
                  await github.rest.actions.deleteArtifact({
                    owner: repo.owner.login, repo: repo.name, artifact_id: artifact.id,
                  });
                }
                repoDeleted++;
                repoFreed += artifact.size_in_bytes;
              }

              if (repoDeleted > 0) {
                console.log(`${fullName}: ${repoDeleted} artifact(s), ${(repoFreed / 1048576).toFixed(1)} MB freed`);
              }
              totalDeleted += repoDeleted;
              totalFreed += repoFreed;
              totalRepos++;
            }

            const freedMB = (totalFreed / 1048576).toFixed(1);
            console.log(`\nDone. ${dryRun ? 'Found' : 'Deleted'} ${totalDeleted} artifacts (${freedMB} MB) across ${totalRepos} repos.`);

            const beforeMB = parseFloat('${{ needs.quota-check.outputs.before_mb }}');
            const afterMB = Math.max(0, beforeMB - parseFloat(freedMB)).toFixed(1);
            console.log(`Storage: ${beforeMB} MB → ${afterMB} MB`);
