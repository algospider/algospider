name: Cleanup old artifacts
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      days_old:
        description: 'Delete artifacts older than this many days'
        default: '7'
        type: number
      dry_run:
        description: 'Only list artifacts, do not delete'
        default: 'false'
        type: boolean

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old artifacts across all repos
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const daysOld = ${{ github.event.inputs.days_old || 7 }};
            const dryRun = '${{ github.event.inputs.dry_run }}' === 'true';
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - daysOld);

            let totalDeleted = 0;
            let totalRepos = 0;
            let repoPage = 1;
            let hasMoreRepos = true;

            while (hasMoreRepos) {
              const repos = await github.paginate(github.rest.repos.listForAuthenticatedUser, {
                per_page: 100,
                page: repoPage,
                type: 'owner',
              });

              if (repos.length === 0) break;

              for (const repo of repos) {
                const fullName = repo.full_name;
                if (repo.archived) {
                  console.log(`Skipping archived repo: ${fullName}`);
                  continue;
                }

                let artifactPage = 1;
                let hasMoreArtifacts = true;
                let repoDeleted = 0;

                while (hasMoreArtifacts) {
                  const { data } = await github.rest.actions.listArtifactsForRepo({
                    owner: repo.owner.login,
                    repo: repo.name,
                    per_page: 100,
                    page: artifactPage,
                  });

                  const oldArtifacts = data.artifacts.filter(
                    a => new Date(a.created_at) < cutoff
                  );

                  for (const artifact of oldArtifacts) {
                    console.log(
                      `${dryRun ? '[DRY RUN] Would delete' : 'Deleting'} ` +
                      `[${fullName}] "${artifact.name}" (id: ${artifact.id}, created: ${artifact.created_at})`
                    );
                    if (!dryRun) {
                      await github.rest.actions.deleteArtifact({
                        owner: repo.owner.login,
                        repo: repo.name,
                        artifact_id: artifact.id,
                      });
                    }
                  }

                  repoDeleted += oldArtifacts.length;
                  hasMoreArtifacts = data.total_count > artifactPage * 100;
                  artifactPage++;
                }

                if (repoDeleted > 0) {
                  console.log(`${fullName}: ${repoDeleted} artifact(s) processed`);
                }
                totalDeleted += repoDeleted;
                totalRepos++;
              }

              hasMoreRepos = repos.length === 100;
              repoPage++;
            }

            console.log(`Done. Scanned ${totalRepos} repos. ${dryRun ? 'Found' : 'Deleted'} ${totalDeleted} artifacts older than ${daysOld} days.`);
