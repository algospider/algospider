name: Cleanup old artifacts
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      days_old:
        description: 'Delete artifacts older than this many days'
        default: '7'
        type: number
      dry_run:
        description: 'Only list artifacts, do not delete'
        default: 'false'
        type: boolean

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const daysOld = ${{ github.event.inputs.days_old || 7 }};
            const dryRun = '${{ github.event.inputs.dry_run }}' === 'true';
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - daysOld);

            let totalDeleted = 0;
            let page = 1;
            let hasMore = true;

            while (hasMore) {
              const { data } = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page: page,
              });

              const oldArtifacts = data.artifacts.filter(
                a => new Date(a.created_at) < cutoff
              );

              for (const artifact of oldArtifacts) {
                console.log(
                  `${dryRun ? '[DRY RUN] Would delete' : 'Deleting'} ` +
                  `"${artifact.name}" (id: ${artifact.id}, created: ${artifact.created_at})`
                );
                if (!dryRun) {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id,
                  });
                }
              }

              totalDeleted += oldArtifacts.length;
              hasMore = data.total_count > page * 100;
              page++;
            }

            const action = dryRun ? 'Found' : 'Deleted';
            console.log(`${action} ${totalDeleted} artifacts older than ${daysOld} days`);
