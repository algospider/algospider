<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 162" fill="none">
  <!-- algospider · banner (light) · compact & crisp -->
  <style>
    text { font-family: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
  </style>

  <line x1="16" y1="18" x2="664" y2="18" stroke="#D0D7DE" stroke-width="1"/>
  <rect x="16" y="18" width="3" height="7" fill="#1F6FEB"/>
  <text x="24" y="12" font-size="8.5" fill="#57606A" letter-spacing="1.2">01 / dev machine on android</text>
  <text x="664" y="12" font-size="8.5" fill="#57606A" letter-spacing="0.8" text-anchor="end">fig. 01 — self-portrait</text>

  <g transform="rotate(-3 56 80)">
    <rect x="18" y="44" width="74" height="68" rx="8" stroke="#1F6FEB" stroke-width="1.4" stroke-dasharray="5 3" opacity="0.85"/>
    <rect x="24" y="50" width="62" height="56" rx="6" stroke="#D0D7DE" stroke-width="1"/>
    <text x="55" y="74" font-size="17" fill="#1F6FEB" text-anchor="middle" font-weight="700" letter-spacing="1.5">AS</text>
    <text x="55" y="89" font-size="8" fill="#57606A" text-anchor="middle" letter-spacing="0.8">EST 2025</text>
    <text x="55" y="100" font-size="7" fill="#8C959F" text-anchor="middle">/dev/phone</text>
  </g>
  <circle cx="94" cy="110" r="2" fill="#1F6FEB">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <text x="118" y="68" font-size="34" font-weight="800" fill="#1F2328" letter-spacing="-0.3">algospider</text>

  <rect x="328" y="44" width="8" height="26" fill="#1F6FEB">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="118" y="91" font-size="12" fill="#24292F">turn android into a dev machine · offline ai</text>
  <text x="118" y="108" font-size="9.5" fill="#57606A">zero logins · zero api keys · zero cloud dependencies</text>

  <text x="118" y="125" font-size="9" letter-spacing="0.5">
    <tspan fill="#1F6FEB" font-weight="600">kotlin</tspan>
    <tspan fill="#8C959F"> / </tspan>
    <tspan fill="#57606A">compose</tspan>
    <tspan fill="#8C959F"> / </tspan>
    <tspan fill="#57606A">python</tspan>
    <tspan fill="#8C959F"> / </tspan>
    <tspan fill="#57606A">go</tspan>
    <tspan fill="#8C959F"> / </tspan>
    <tspan fill="#57606A">ts</tspan>
    <tspan fill="#8C959F"> / </tspan>
    <tspan fill="#1F6FEB" font-weight="600">termux</tspan>
  </text>

  <g stroke="#1F6FEB" stroke-width="1" opacity="0.8">
    <line x1="510" y1="105" x2="558" y2="55"/>
    <line x1="510" y1="105" x2="578" y2="100"/>
    <line x1="510" y1="105" x2="538" y2="42"/>
    <line x1="558" y1="55" x2="604" y2="34"/>
    <line x1="558" y1="55" x2="596" y2="82"/>
    <line x1="558" y1="55" x2="538" y2="42"/>
    <line x1="596" y1="82" x2="632" y2="58"/>
    <line x1="596" y1="82" x2="640" y2="104"/>
    <line x1="578" y1="100" x2="596" y2="82"/>
    <line x1="640" y1="104" x2="604" y2="34" stroke-dasharray="3 3"/>
  </g>
  <g>
    <circle cx="510" cy="105" r="4" fill="#FFFFFF" stroke="#1F6FEB" stroke-width="1.4"/>
    <circle cx="558" cy="55" r="5.5" fill="#1F6FEB"/>
    <circle cx="604" cy="34" r="3.5" fill="#FFFFFF" stroke="#1F6FEB" stroke-width="1.4"/>
    <circle cx="596" cy="82" r="4" fill="#FFFFFF" stroke="#1F6FEB" stroke-width="1.4"/>
    <circle cx="640" cy="104" r="3.5" fill="#FFFFFF" stroke="#1F6FEB" stroke-width="1.4"/>
    <circle cx="632" cy="58" r="3" fill="#FFFFFF" stroke="#1F6FEB" stroke-width="1.4"/>
    <circle cx="578" cy="100" r="3" fill="#FFFFFF" stroke="#1F6FEB" stroke-width="1.4"/>
    <circle cx="538" cy="42" r="3.5" fill="#FFFFFF" stroke="#1F6FEB" stroke-width="1.4"/>
  </g>
  <circle cx="558" cy="55" r="8.5" fill="#1F6FEB" opacity="0.10">
    <animate attributeName="r" values="7;11;7" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="596" cy="82" r="1.8" fill="#1F6FEB">
    <animate attributeName="opacity" values="1;0.15;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <line x1="16" y1="140" x2="664" y2="140" stroke="#D0D7DE" stroke-width="1" stroke-dasharray="2 4"/>
  <rect x="661" y="133" width="3" height="7" fill="#1F6FEB"/>
  <text x="24" y="153" font-size="8" fill="#8C959F">&#9656; read down &#183; nothing here is a metaphor</text>
  <text x="664" y="153" font-size="8" fill="#8C959F" text-anchor="end">nov 2026 &#183; edition 3</text>
</svg>