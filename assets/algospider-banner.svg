<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 172" fill="none">
  <!-- algospider · banner (dark) · hand-set type, node web, smil only -->
  <style>
    text { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
  </style>

  <!-- margin ruling -->
  <line x1="16" y1="20" x2="744" y2="20" stroke="#30363D" stroke-width="1"/>
  <line x1="16" y1="154" x2="744" y2="154" stroke="#30363D" stroke-width="1" stroke-dasharray="2 4"/>
  <rect x="16" y="20" width="3" height="9" fill="#58A6FF"/>
  <rect x="741" y="145" width="3" height="9" fill="#58A6FF"/>

  <!-- index edge, numbered by hand -->
  <text x="18" y="14" font-size="9" fill="#6E7681" letter-spacing="2">01 / dotfiles of a phone that ships</text>
  <text x="610" y="14" font-size="9" fill="#6E7681" letter-spacing="1">fig. 01 — self-portrait</text>
  <text x="18" y="167" font-size="9" fill="#6E7681">&#9656; read down &#183; nothing there is a metaphor</text>
  <text x="526" y="167" font-size="9" fill="#6E7681">nov 2026 &#183; edition 3</text>

  <!-- stamp block: deliberately off-true -->
  <g transform="rotate(-4 74 92)">
    <rect x="34" y="56" width="80" height="72" rx="10" stroke="#58A6FF" stroke-width="1.5" stroke-dasharray="6 3 1 3" opacity="0.9"/>
    <rect x="42" y="64" width="64" height="56" rx="7" stroke="#30363D" stroke-width="1"/>
    <text x="74" y="88" font-size="17" fill="#58A6FF" text-anchor="middle" font-weight="700">A&#8202;S</text>
    <text x="74" y="105" font-size="8.5" fill="#8B949E" text-anchor="middle" letter-spacing="1">EST 2025</text>
    <text x="74" y="116" font-size="7" fill="#6E7681" text-anchor="middle">/dev/phone</text>
  </g>
  <circle cx="112" cy="126" r="2.5" fill="#58A6FF">
    <animate attributeName="opacity" values="1;0.15;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- logotype: hand-set, nudged letters -->
  <g font-weight="700" font-size="46" fill="#E6EDF3">
    <text x="150" y="94" font-size="46">a</text>
    <text x="177" y="96" font-size="46" opacity="0.92">l</text>
    <text x="184" y="93" font-size="46" opacity="0.96">g</text>
    <text x="212" y="95.5" font-size="46">o</text>
    <text x="238" y="93" font-size="46" opacity="0.9">s</text>
    <text x="262" y="96" font-size="46">p</text>
    <text x="289" y="94" font-size="46" opacity="0.94">i</text>
    <text x="298" y="95" font-size="46" opacity="0.97">d</text>
    <text x="326" y="94" font-size="46">e</text>
    <text x="352" y="96" font-size="46" opacity="0.92">r</text>
  </g>

  <!-- idle cursor after logotype -->
  <rect x="378" y="62" width="11" height="33" fill="#58A6FF">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- subline -->
  <text x="151" y="122" font-size="13.5" fill="#8B949E" letter-spacing="0.3">i turn androids into dev machines &#183; offline ai</text>
  <text x="151" y="141" font-size="10.5" fill="#6E7681">no logins &#183; no api keys &#183; nothing phones here by accident</text>

  <!-- tool chips -->
  <g font-size="9" letter-spacing="1">
    <text x="151" y="160" fill="#58A6FF">kotlin</text>
    <text x="196" y="160" fill="#6E7681">/</text>
    <text x="206" y="160" fill="#8B949E">compose</text>
    <text x="262" y="160" fill="#6E7681">/</text>
    <text x="272" y="160" fill="#8B949E">python</text>
    <text x="318" y="160" fill="#6E7681">/</text>
    <text x="328" y="160" fill="#8B949E">go</text>
    <text x="350" y="160" fill="#6E7681">/</text>
    <text x="360" y="160" fill="#8B949E">ts</text>
    <text x="376" y="160" fill="#6E7681">/</text>
    <text x="386" y="160" fill="#58A6FF">termux</text>
  </g>

  <!-- web: nodes and hand-pulled threads -->
  <g stroke="#58A6FF" stroke-width="1" opacity="0.85">
    <line x1="560" y1="132" x2="620" y2="70"/>
    <line x1="560" y1="132" x2="640" y2="126"/>
    <line x1="560" y1="132" x2="596" y2="52"/>
    <line x1="620" y1="70" x2="668" y2="42"/>
    <line x1="620" y1="70" x2="664" y2="100"/>
    <line x1="620" y1="70" x2="596" y2="52"/>
    <line x1="664" y1="100" x2="700" y2="72"/>
    <line x1="664" y1="100" x2="712" y2="130"/>
    <line x1="640" y1="126" x2="664" y2="100"/>
    <line x1="712" y1="130" x2="668" y2="42" stroke-dasharray="3 4"/>
  </g>
  <g>
    <circle cx="560" cy="132" r="5" fill="#0D1117" stroke="#58A6FF" stroke-width="1.5"/>
    <circle cx="620" cy="70" r="7" fill="#58A6FF"/>
    <circle cx="668" cy="42" r="4" fill="#0D1117" stroke="#58A6FF" stroke-width="1.5"/>
    <circle cx="664" cy="100" r="5" fill="#0D1117" stroke="#58A6FF" stroke-width="1.5"/>
    <circle cx="712" cy="130" r="4" fill="#0D1117" stroke="#58A6FF" stroke-width="1.5"/>
    <circle cx="700" cy="72" r="3.5" fill="#0D1117" stroke="#58A6FF" stroke-width="1.5"/>
    <circle cx="640" cy="126" r="3" fill="#0D1117" stroke="#58A6FF" stroke-width="1.5"/>
    <circle cx="596" cy="52" r="4.5" fill="#0D1117" stroke="#58A6FF" stroke-width="1.5"/>
  </g>
  <!-- caught pixel: the only animated node -->
  <circle cx="620" cy="70" r="10" fill="#58A6FF" opacity="0.12">
    <animate attributeName="r" values="8;13;8" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="664" cy="100" r="2" fill="#58A6FF">
    <animate attributeName="opacity" values="1;0.1;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="586" y="152" font-size="8.5" fill="#6E7681" text-anchor="middle">web calm here</text>
</svg>
